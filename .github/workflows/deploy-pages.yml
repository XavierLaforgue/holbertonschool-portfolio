# A line starting with # is a YAML comment: a note for humans, ignored by GitHub.
# In YAML, indentation (spaces, never tabs) defines the structure, and "key: value" pairs
# describe settings.
# The name shown in the repository's Actions tab.
name: Deploy Landing Page to GitHub Pages

# WHEN to run: on a push to the main branch, ONLY IF at least one changed file is under
# app/landing-page/ (** = any file in any sub-folder). Pushes to other
# branches don't trigger it.
# The `workflow_dispatch` event: this allows to manually run the
# workflow from the GitHub Actions interface, useful when you want to deploy without making a new commit.

on:
  push:
    branches: [main]
    paths: [app/landing-page/**]
  workflow_dispatch:

# What the workflow is allowed to do:
# - "contents: read" lets it read the repository's contents,
# - "pages: write" lets it publish to GitHub Pages, and
# - "id-token: write" lets it prove its identity to the Pages service.
# Everything else stays forbidden, which is safer than giving it all permissions.
permissions:
  pages: write
  id-token: write

# In case of simultaneous (or quick) pushes, group deployments together.defaults:
# "group: pages" defines the group to which the workflow
# belongs and all workflows with the same concurrency group share the
# same concurrency control.
# "cancel-in-progress: false" lets an already running deployment
# finish instead of being interrupted halway through because another
# deployment is waiting.
concurrency:
  group: pages
  cancel-in-progress: false

# A workflow has one or more jobs; this one has a single job named
# "deploy". Here, "deploy" is only an identifier I can choose, I could
# name it "publish", "website", etc.
jobs:
  deploy:
    # Run on a fresh Linux virtual machine provided by GitHub.
    runs-on: ubuntu-latest
    # Records the deployment in the "github-pages" environment and shows the site URL produced
    # by the step with "id: deployment" (below). ${{ ... }} is GitHub's expression syntax.
    environment:
    # Examples of environments in a larger project could be:
    # - development
    # - staging
    # - production
    # For GitHub Pages, the conventional environment name is github-pages.
      name: github-pages
      # This is a reference to an output produced by a step.
      # - steps: refers to the steps of the job.
      # - deployment: refers to a step identified by the ID deployment.
      # - outputs: refers to the output values generated by that step.
      # - page_url: refers to the URL of your deployed website.
      url: ${{ steps.deployment.outputs.page_url }}
    # "steps", where the actual deployment process happens.
    steps:
      # Step 1: download the repository's code onto that machine.
      # "uses:" runs a ready-made action; "@v6" pins its major version.
      # This means:
      # - actions: the GitHub organization that provides the action.
      # - checkout: the action's name.
      # - @v7: the version of the action being used.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Step 2: configure GitHub Pages. This action prepares GitHub
      # Pages for deployment. It helps configure the Pages environment
      # and provides support for static-site build workflows.
      # Currently, we do not need to generate a website from a
      # framework. However, this setup step is part of the recommended
      # workflow and is useful when the project evolves. The workflow
      # can then be adapted to build the site with React, Vue, ...
      # before uploading it.
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6
      
      # Step 3: package ONLY the app/landing-page folder (an "artifact") for Pages.
      # Files outside this folder aren't published (that's why the page
      # has its own images).
      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/landing-page

      # Step 3: publish the package. "id: deployment" names the step so that
      # page_url can be read in "environment" above.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
